name: Release

# Publishes every package whose version in package.json is not on npm yet.
# Needs the NPM_TOKEN secret: an npm granular token with read/write on the three packages
# (and "bypass two-factor authentication" if the account requires 2FA).
on:
  workflow_dispatch:
  push:
    tags: ['*@*']

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run meta:check
      - run: bun run build
      - run: bun run test
      - name: Publish new versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/ui packages/mcp packages/create-nusa-admin; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm — skipping"
            else
              echo "Publishing $name@$version"
              (cd "$dir" && npm publish --access public --provenance)
            fi
          done
