<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__TITLE__</title>
    <script>
      // Apply saved theme/direction before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('nu-theme') || '{}')
        var dark = t.mode === 'dark' || ((!t.mode || t.mode === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (JSON.parse(localStorage.getItem('nu-layout') || '{}').rtl) document.documentElement.dir = 'rtl'
      } catch (e) {}
    </script>
    <script>
      // GitHub Pages SPA fallback: 404.html sends deep links here as ?p=<path>&q=<query>.
      ;(function () {
        var s = new URLSearchParams(location.search)
        var p = s.get('p')
        if (p === null) return
        var q = s.get('q')
        history.replaceState(null, '', location.pathname.replace(/\/?$/, '/') + p.replace(/^\//, '') + (q ? '?' + q : '') + location.hash)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
